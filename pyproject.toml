[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brainelecqc"
version = "0.1.0"
description = "Traceable electrophysiology QC foundations for EEG, SEEG and ECoG"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
api = ["flask>=3.0"]
readers = ["mne>=1.9,<2", "scipy>=1.10"]
test = ["pytest>=8", "flask>=3.0", "mne>=1.9,<2", "scipy>=1.10", "matplotlib>=3.8"]
figures = ["matplotlib>=3.8", "scipy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
brainelecqc = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
